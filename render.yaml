# Render blueprint: one web service builds the Angular app and serves it from the Node backend.
services:
  - type: web
    name: buywise-ai
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Angular 21 needs Node >= 20.19; pin a current LTS for the build.
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: ALLOW_DEMO_CATALOG
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      # "on" shows Continue with PayPal; needs Log in with PayPal enabled for the app in PayPal's dashboard.
      - key: PAYPAL_LOGIN
        value: "off"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      # Hard cap on AI conversations per day for the public demo (protects the API bill).
      - key: DAILY_AI_TURN_LIMIT
        value: "400"
      # Public URL of this service, e.g. https://buywise-ai.onrender.com - also the
      # "Log in with PayPal" return URL base (<PUBLIC_URL>/api/auth/paypal/callback).
      - key: PUBLIC_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: DEMO_PIN
        sync: false
